<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JX3 Ani Player · F1 FBX actor (花萝)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #080c12; overflow: hidden; }
    #c { width: 100%; height: 100%; display: block; }
    #hud {
      position: absolute; left: 10px; top: 8px; z-index: 2;
      color: #c8d0d8; font: 12px/1.4 ui-monospace, Menlo, monospace;
      text-shadow: 0 1px 2px #000; pointer-events: none;
    }
    #sfx-progress {
      position: absolute; left: 10px; top: 34px; width: min(360px, calc(100vw - 20px));
      z-index: 3; display: none; color: #dbe8f5; font: 11px/1.3 system-ui, sans-serif;
      text-shadow: 0 1px 2px #000; pointer-events: none;
    }
    #sfx-progress-track {
      height: 8px; margin-top: 4px; overflow: hidden; border: 1px solid #52677d;
      border-radius: 5px; background: #121c27;
    }
    #sfx-progress-fill {
      width: 0%; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, #4ea8ff, #9be7ff);
      transition: width 120ms ease-out;
    }
    #controls-help {
      position: absolute; right: 10px; bottom: 8px; z-index: 2;
      color: #9eafbf; font: 11px/1.3 system-ui, sans-serif;
      text-shadow: 0 1px 2px #000; pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">loading F1 花萝 FBX…</div>
  <div id="sfx-progress" aria-live="polite">
    <div id="sfx-progress-label">Loading SFX…</div>
    <div id="sfx-progress-track"><div id="sfx-progress-fill"></div></div>
  </div>
  <div id="controls-help">wheel: zoom · drag: orbit · right-drag: pan</div>
  <script type="module" src="./fbx_viewport.js?v=7020"></script>
</body>
</html>
